name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Ghost recording tests
        run: npm test

      - name: Bundle budget
        run: npm run test:budget

      - name: Smoke test
        run: npm run test:smoke

      - name: Upload smoke failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
